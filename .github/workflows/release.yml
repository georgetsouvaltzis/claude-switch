name: Release

# Runs when a release is published (Releases -> Draft a new release, with a
# new tag like 0.1.0). Tests the tagged commit, attaches the binaries to that
# release and updates the Homebrew formula in georgetsouvaltzis/homebrew-tap.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like 0.1.0, got '$TAG'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # Go modules only see tags that start with v, so `go install ...@latest`
      # needs v0.1.0 next to 0.1.0.
      - name: Add the Go module tag
        run: |
          git tag -f "v$TAG"
          git push -f origin "v$TAG"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both tags sit on this commit; release the one that was published.
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}

      - name: Update Homebrew formula
        if: ${{ !github.event.release.prerelease }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/georgetsouvaltzis/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/VERSION/${TAG}/g" -e "s/SHA256/${sha}/" -e '/^# /d' .github/homebrew/csw.rb > tap/Formula/csw.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/csw.rb
          git commit -m "csw ${TAG}"
          git push
