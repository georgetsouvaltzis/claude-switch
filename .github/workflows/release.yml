name: Release

# Runs when a release is published (Releases -> Draft a new release, with a
# new tag like 0.1.0). Tests the tagged commit, attaches the binaries to that
# release, and updates the Homebrew formula (georgetsouvaltzis/homebrew-tap)
# and the Scoop manifest (georgetsouvaltzis/scoop-bucket).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like 0.1.0, got '$TAG'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # Go modules only see tags that start with v, so `go install ...@latest`
      # needs v0.1.0 next to 0.1.0.
      - name: Add the Go module tag
        run: |
          git tag -f "v$TAG"
          git push -f origin "v$TAG"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          # Both tags sit on this commit; release the one that was published.
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}

      - name: Update Homebrew formula
        if: ${{ !github.event.release.prerelease }}
        env:
          TAP_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          sha() { grep "csw_${TAG}_$1.tar.gz" dist/checksums.txt | cut -d' ' -f1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/georgetsouvaltzis/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e '/^# /d' -e "s/VERSION/${TAG}/g" \
            -e "s/SHA_DARWIN_ARM64/$(sha darwin_arm64)/" -e "s/SHA_DARWIN_AMD64/$(sha darwin_amd64)/" \
            -e "s/SHA_LINUX_ARM64/$(sha linux_arm64)/" -e "s/SHA_LINUX_AMD64/$(sha linux_amd64)/" \
            .github/homebrew/csw.rb > tap/Formula/csw.rb
          if grep -q 'sha256 ""' tap/Formula/csw.rb; then
            echo "::error::a checksum is missing from dist/checksums.txt"
            exit 1
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/csw.rb
          git commit -m "csw ${TAG}"
          git push
