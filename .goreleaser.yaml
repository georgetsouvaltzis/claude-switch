version: 2

project_name: csw

builds:
  - id: csw
    main: ./cmd/csw
    binary: csw
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

# Windows: writes csw.json into georgetsouvaltzis/scoop-bucket. Prereleases
# are skipped (skip_upload: auto).
scoops:
  - name: csw
    homepage: https://github.com/georgetsouvaltzis/claude-switch
    description: Switch between Claude subscriptions in Claude Code
    license: MIT
    skip_upload: auto
    repository:
      owner: georgetsouvaltzis
      name: scoop-bucket
      token: "{{ .Env.PACKAGES_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "csw {{ .Tag }}"

# The release already exists (published from the GitHub UI): keep its title
# and notes, only attach the archives. Replacing existing files makes a
# re-run of a failed release safe.
release:
  mode: keep-existing
  replace_existing_artifacts: true
